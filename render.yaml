services:
  - type: web
    name: atlas-crime-analysis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ATLAS_SYNTHETIC_ONLY
        value: "false"
      - key: SEED_SAMPLE_DATA
        value: "false"
      - key: LLM_PROVIDER
        value: "groq"
      - key: LLM_MODEL
        value: "openai/gpt-oss-120b"
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_URL
        sync: false
      - key: UPSTASH_TOKEN
        sync: false
